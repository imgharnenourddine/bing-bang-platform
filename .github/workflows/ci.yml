name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: f07_test
          POSTGRES_USER: f07_test
          POSTGRES_PASSWORD: f07-ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U f07_test -d f07_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      F02_TEST_DB_URL: jdbc:postgresql://localhost:5432/f07_test
      F02_TEST_DB_USER: f07_test
      F02_TEST_DB_PASSWORD: f07-ci-only-password
      F04_TEST_DB_URL: jdbc:postgresql://localhost:5432/f07_test
      F04_TEST_DB_USER: f07_test
      F04_TEST_DB_PASSWORD: f07-ci-only-password
      F05_TEST_DB_URL: jdbc:postgresql://localhost:5432/f07_test
      F05_TEST_DB_USER: f07_test
      F05_TEST_DB_PASSWORD: f07-ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode clean verify
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run test:shared && npm run build
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: bigbang
      POSTGRES_USER: bigbang
      POSTGRES_PASSWORD: ci-only-password
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-only-password-not-production
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: curl --fail --retry 5 --retry-delay 2 http://localhost:8080/actuator/health/readiness && curl --fail http://localhost:8088/
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
