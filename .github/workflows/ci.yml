name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode verify
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run test:shared && npm run build
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: bigbang
      POSTGRES_USER: bigbang
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: curl --fail --retry 5 --retry-delay 2 http://localhost:8080/actuator/health/readiness && curl --fail http://localhost:8088/
      - if: always()
        run: docker compose logs && docker compose down -v
