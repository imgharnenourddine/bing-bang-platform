services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  flyway:
    build: ./database
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 20
    command: migrate
    depends_on:
      postgres: { condition: service_healthy }
    networks: [platform]
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW: ${LOGIN_WINDOW:-15m}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:8088}
      WS_HEARTBEAT_MS: ${WS_HEARTBEAT_MS:-10000}
      WS_MESSAGE_SIZE_BYTES: ${WS_MESSAGE_SIZE_BYTES:-65536}
      WS_SEND_BUFFER_BYTES: ${WS_SEND_BUFFER_BYTES:-262144}
      WS_SEND_TIMEOUT_MS: ${WS_SEND_TIMEOUT_MS:-10000}
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    depends_on:
      flyway: { condition: service_completed_successfully }
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${WEB_PORT:-8088}:80"]
    depends_on:
      backend: { condition: service_healthy }
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  platform:
volumes:
  postgres_data:
