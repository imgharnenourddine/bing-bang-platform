spring:
  application:
    name: bigbang
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  session:
    jdbc:
      initialize-schema: never
    timeout: ${SESSION_TIMEOUT:30m}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

app:
  bootstrap:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    window: ${LOGIN_WINDOW:15m}
