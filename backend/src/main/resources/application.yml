spring:
  application:
    name: bigbang
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  session:
    jdbc:
      initialize-schema: never
    timeout: ${SESSION_TIMEOUT:30m}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

app:
  bootstrap:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    window: ${LOGIN_WINDOW:15m}
  realtime:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:8088}
    heartbeat-ms: ${WS_HEARTBEAT_MS:10000}
    message-size-bytes: ${WS_MESSAGE_SIZE_BYTES:65536}
    send-buffer-bytes: ${WS_SEND_BUFFER_BYTES:262144}
    send-timeout-ms: ${WS_SEND_TIMEOUT_MS:10000}
